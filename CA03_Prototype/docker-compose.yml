# ============================================================
# MediConnect - Clinic Appointment Booking Platform (CA03 Prototype)
# Microservices orchestration (deployment demonstration)
#
# Public entry points:
#   - Frontend (Web App):        http://localhost:3000
#   - API Gateway:               http://localhost:8090
#   - RabbitMQ management UI:    http://localhost:15672  (guest / guest)
#   - Mailpit (demo email inbox): http://localhost:8025
#
# Only the gateway, frontend and the two admin UIs are exposed to the host;
# the microservices are reachable only inside the Docker network (through the
# gateway), which mirrors the CA01 architecture.
#
# Stateless services have no fixed container_name, so they can be scaled:
#   docker compose up -d --scale appointment-service=3
# ============================================================
services:

  # ---------- Infrastructure ----------
  mongodb:
    # MongoDB 5.0+ needs a CPU with AVX; 4.4 is the last version that runs
    # without it (this machine's CPU has no AVX). Fully compatible with the code.
    image: mongo:4.4
    container_name: mc-mongodb
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mc-rabbitmq
    hostname: rabbitmq
    # Pre-create the Erlang cookie owned by the rabbitmq user before startup.
    # On this Docker Desktop setup the default handling leaves the cookie
    # root-owned and unreadable, causing ".erlang.cookie: eacces".
    entrypoint:
      - /bin/bash
      - -c
      - "printf mediconnectcookie > /var/lib/rabbitmq/.erlang.cookie && chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 600 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server"
    ports:
      - "15672:15672"
    expose:
      - "5672"
    healthcheck:
      # Slow CPUs need ~155s to boot RabbitMQ, so the start period is generous.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 200s

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mc-mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"

  # ---------- Microservices (each owns its own database) ----------
  # Services start serving HTTP immediately and connect to RabbitMQ in the
  # background; events wait in each service's outbox until the broker is up.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 4001
      MONGO_URL: mongodb://mongodb:27017/auth_db
      RABBIT_URL: amqp://rabbitmq:5672
      APPOINTMENT_URL: http://appointment-service:4002
      JWT_SECRET: mediconnect_dev_secret
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile
    environment:
      PORT: 4002
      MONGO_URL: mongodb://mongodb:27017/appointment_db
      RABBIT_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  records-service:
    build:
      context: .
      dockerfile: services/records-service/Dockerfile
    environment:
      PORT: 4003
      MONGO_URL: mongodb://mongodb:27017/records_db
      RABBIT_URL: amqp://rabbitmq:5672
      APPOINTMENT_URL: http://appointment-service:4002
      PUBLIC_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: 4004
      MONGO_URL: mongodb://mongodb:27017/notification_db
      RABBIT_URL: amqp://rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      REMINDER_LEAD_HOURS: ${REMINDER_LEAD_HOURS:-24}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      PORT: 4005
      MONGO_URL: mongodb://mongodb:27017/payment_db
      RABBIT_URL: amqp://rabbitmq:5672
      APPOINTMENT_URL: http://appointment-service:4002
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    environment:
      PORT: 4006
      MONGO_URL: mongodb://mongodb:27017/admin_db
      RABBIT_URL: amqp://rabbitmq:5672
      AUTH_URL: http://auth-service:4001
      APPOINTMENT_URL: http://appointment-service:4002
      RECORDS_URL: http://records-service:4003
      NOTIFICATION_URL: http://notification-service:4004
      PAYMENT_URL: http://payment-service:4005
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # ---------- API Gateway (single public entry point) ----------
  api-gateway:
    build: ./api-gateway
    container_name: mc-gateway
    ports:
      # Host 8090 -> container 8080 (host 8080 is used by another app on the
      # developer machine). The frontend reaches the gateway internally.
      - "8090:8080"
    environment:
      PORT: 8080
      JWT_SECRET: mediconnect_dev_secret
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://auth-service:4001
      APPOINTMENT_URL: http://appointment-service:4002
      RECORDS_URL: http://records-service:4003
      NOTIFICATION_URL: http://notification-service:4004
      PAYMENT_URL: http://payment-service:4005
      ADMIN_URL: http://admin-service:4006
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      appointment-service:
        condition: service_started
      records-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      admin-service:
        condition: service_started
    restart: unless-stopped

  # ---------- Frontend (React SPA served by nginx) ----------
  frontend:
    build: ./frontend
    container_name: mc-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  mongo-data:
