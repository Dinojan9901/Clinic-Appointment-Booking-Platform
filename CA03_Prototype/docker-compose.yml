# ============================================================
# MediConnect - Clinic Appointment Booking Platform (CA03 Prototype)
# Microservices orchestration (deployment demonstration)
#
# Public entry points:
#   - Frontend (Web App):        http://localhost:3000
#   - API Gateway:               http://localhost:8080
#   - RabbitMQ management UI:     http://localhost:15672  (guest / guest)
#
# Only the API Gateway and Frontend are exposed to the host; the individual
# microservices are reachable only inside the Docker network (through the
# gateway), which mirrors the CA01 architecture.
# ============================================================
services:

  # ---------- Infrastructure ----------
  mongodb:
    # MongoDB 5.0+ needs a CPU with AVX; 4.4 is the last version that runs
    # without it (this machine's CPU has no AVX). Fully compatible with the code.
    image: mongo:7
    container_name: mc-mongodb
    # Not published to the host to avoid clashing with any local MongoDB or
    # another project's container on 27017. Services reach it over the internal
    # Docker network as mongodb:27017. (Add a "ports:" mapping only if you want
    # to inspect it from the host with MongoDB Compass.)
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mc-rabbitmq
    hostname: rabbitmq
    # Pre-create the Erlang cookie owned by the rabbitmq user before startup.
    # On this Docker Desktop setup the default handling leaves the cookie
    # root-owned and unreadable, causing ".erlang.cookie: eacces". Writing it
    # ourselves with the right ownership/permissions avoids that.
    entrypoint:
      - /bin/bash
      - -c
      - "printf mediconnectcookie > /var/lib/rabbitmq/.erlang.cookie && chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 600 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server"
    ports:
      - "15672:15672"   # Management UI (AMQP 5672 stays internal to the network)
    expose:
      - "5672"
    healthcheck:
      # This CPU is slow: RabbitMQ takes ~155s to boot and the diagnostics CLI
      # itself is heavy, so the timeout/start_period must be generous.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 200s

  # ---------- Microservices (each owns its own database) ----------
  auth-service:
    build: ./services/auth-service
    container_name: mc-auth
    environment:
      PORT: 4001
      MONGO_URL: mongodb://mongodb:27017/auth_db
      JWT_SECRET: mediconnect_dev_secret
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  appointment-service:
    build: ./services/appointment-service
    container_name: mc-appointment
    environment:
      PORT: 4002
      MONGO_URL: mongodb://mongodb:27017/appointment_db
      RABBIT_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  records-service:
    build: ./services/records-service
    container_name: mc-records
    environment:
      PORT: 4003
      MONGO_URL: mongodb://mongodb:27017/records_db
      RABBIT_URL: amqp://rabbitmq:5672
      APPOINTMENT_URL: http://appointment-service:4002
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: mc-notification
    environment:
      PORT: 4004
      MONGO_URL: mongodb://mongodb:27017/notification_db
      RABBIT_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ---------- API Gateway (single public entry point) ----------
  api-gateway:
    build: ./api-gateway
    container_name: mc-gateway
    ports:
      # Host 8090 -> container 8080 (host 8080 is used by another app on this
      # machine). The frontend reaches the gateway internally as api-gateway:8080,
      # so this host mapping is only for hitting the gateway directly.
      - "8090:8080"
    environment:
      PORT: 8080
      JWT_SECRET: mediconnect_dev_secret
      AUTH_URL: http://auth-service:4001
      APPOINTMENT_URL: http://appointment-service:4002
      RECORDS_URL: http://records-service:4003
      NOTIFICATION_URL: http://notification-service:4004
    depends_on:
      - auth-service
      - appointment-service
      - records-service
      - notification-service
    restart: unless-stopped

  # ---------- Frontend (React SPA served by nginx) ----------
  frontend:
    build: ./frontend
    container_name: mc-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  mongo-data:
